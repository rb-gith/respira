<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1A24" media="(prefers-color-scheme: dark)">
<meta name="description" content="Calm, guided breathing exercises.">
<title>Respira</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <!-- Home: list of exercises -->
  <section id="home">
    <header class="top">
      <div>
        <h1>Respira</h1>
        <p class="sub" data-t="tagline"></p>
      </div>
      <div class="top-actions">
        <div id="lang" class="lang" role="group" data-t-label="language">
          <button data-lang="en" lang="en" aria-label="English">EN</button>
          <button data-lang="it" lang="it" aria-label="Italiano">IT</button>
        </div>
        <button class="icon-btn" id="info-btn" data-t-label="aboutBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
        </button>
      </div>
    </header>
    <ul id="list" class="list"></ul>
    <footer class="credit"><span data-t="madeBy"></span> · <a href="https://buymeacoffee.com/gionzana" target="_blank" rel="noopener" data-t="coffee"></a></footer>
  </section>

  <!-- Session: one exercise -->
  <section id="session" hidden>
    <header class="bar">
      <button class="icon-btn" id="back" data-t-label="back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2 id="s-name"></h2>
      <button class="icon-btn" id="sound" aria-pressed="false" data-t-label="sound">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/><path class="slash" d="M4 4l16 16"/></svg>
      </button>
    </header>
    <p id="s-how" class="how"></p>

    <button id="tap" class="tap">
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <circle class="track" cx="120" cy="120" r="112"/>
        <circle id="prog" cx="120" cy="120" r="112" fill="none" stroke-width="3" stroke-linecap="round" transform="rotate(-90 120 120)"/>
        <circle id="halo" cx="120" cy="120" r="96"/>
        <path id="guide" fill="none" stroke-width="3" stroke-linejoin="round"/>
        <path id="core"/>
        <circle id="dot" r="8"/>
        <text id="hint" x="120" y="125" text-anchor="middle"></text>
      </svg>
    </button>

    <p id="phase" class="phase"></p>
    <p id="count" class="count"></p>
    <div id="durations" class="chips" role="group" data-t-label="duration"></div>
    <p id="left" class="left"></p>
    <button id="restart" class="link"></button>
  </section>
</main>

<dialog id="info" class="sheet">
  <h2 data-t="aboutTitle"></h2>
  <p data-t="aboutIntro"></p>
  <ul class="about" data-t="about"></ul>
  <p class="safety" data-t="safety"></p>
  <p class="safety" data-t="help"></p>
  <button class="btn" id="info-close" data-t="close"></button>
</dialog>

<script src="lang.js"></script>
<script src="app.js"></script>
</body>
</html>
